services:
  - type: web
    name: familytask-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Completar a mano en el panel de Render con la URL del frontend
      # (Vercel), una vez que exista. Ver docs/deploy.md.
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: familytask-db
          property: connectionString

databases:
  - name: familytask-db
    databaseName: familytask
    user: familytask
