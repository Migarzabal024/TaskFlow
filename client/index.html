<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ff6b4a" />
    <meta
      name="description"
      content="FamilyTask: organizá, asigná y seguí las tareas del hogar con toda tu familia."
    />
    <title>FamilyTask</title>
    <script>
      // Aplica el tema guardado (o la preferencia del sistema) antes del primer
      // render para evitar el "flash" del tema contrario al cargar la página.
      (function () {
        try {
          var stored = window.localStorage.getItem("familytask_theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          // si falla, se queda con el tema claro por defecto
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
